services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: wms
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U wms -d wms"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: {context: ., dockerfile: backend/Dockerfile.api}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Wms: Host=db;Database=wms;Username=wms;Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      Oidc__Authority: ${OIDC_AUTHORITY:?Set OIDC_AUTHORITY}
      Oidc__ClientId: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
      Oidc__ClientSecret: ${OIDC_CLIENT_SECRET}
    depends_on: {db: {condition: service_healthy}}
  worker:
    build: {context: ., dockerfile: backend/Dockerfile.worker}
    environment:
      ConnectionStrings__Wms: Host=db;Database=wms;Username=wms;Password=${POSTGRES_PASSWORD}
      Erp__Endpoint: ${ERP_ENDPOINT:-}
      Erp__SupportsIdempotency: ${ERP_SUPPORTS_IDEMPOTENCY:-false}
      Erp__Protocol: ${ERP_PROTOCOL:-}
      Erp__BearerToken: ${ERP_BEARER_TOKEN:-}
    depends_on: [api]
  web:
    build: {context: ., dockerfile: prototype/Dockerfile}
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]
volumes:
  postgres-data:
