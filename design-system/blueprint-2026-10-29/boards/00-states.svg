<text x="1108.00" y="708" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#a0303d">masalah selesai.</text>
<rect x="1088" y="842" width="444" height="44" rx="4" fill="#ffffff" stroke="#7f8996"/>
<text x="1102.00" y="869" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#29313c">Tinjau konflik</text>
<text x="48.00" y="1040" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#525d6b">Sukses WMS memperlihatkan nomor transaksi dan aktual; status ERP dilaporkan terpisah.</text>
