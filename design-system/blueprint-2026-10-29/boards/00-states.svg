<rect x="578" y="169" width="444" height="226" rx="4" fill="#f0f2f4"/>
<text x="598.00" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#29313c">Filter tanpa hasil</text>
<text x="598.00" y="269" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#29313c">Tidak ada dokumen yang cocok. Filter aktif tetap</text>
<text x="598.00" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#29313c">terlihat.</text>
<rect x="578" y="427" width="444" height="44" rx="4" fill="#ffffff" stroke="#7f8996"/>
