<text x="1108.00" y="269" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#29313c">Memuat dokumen dan sisa terbaru untuk gudang</text>
<text x="1108.00" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#29313c">terpilih.</text>
