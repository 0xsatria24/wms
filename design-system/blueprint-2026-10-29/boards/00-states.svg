<text x="48.00" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#29313c">Keadaan layar dan pemulihan</text>
<text x="48.00" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#525d6b">DESAIN STATIS / Data simulasi / Tindakan di bawah merupakan kontrak desain</text>
